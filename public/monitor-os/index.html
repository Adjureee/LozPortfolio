        <title>John Lyold Lozada - OS</title>
        <script>
            window.onload = () => {
                addEventListener('mousemove', (e) => {
                    window.parent.postMessage(
                        {
                            clientX: e.clientX,
                            clientY: e.clientY,
                            type: 'mousemove',
                        },
                        '*',
                    );
                });
                addEventListener('mousedown', () => {
                    window.parent.postMessage({ type: 'mousedown' }, '*');
                });
                addEventListener('mouseup', () => {
                    window.parent.postMessage({ type: 'mouseup' }, '*');
                });
                addEventListener('keydown', (e) => {
                    window.parent.postMessage(
                        { type: 'keydown', key: e.key },
                        '*',
                    );
                });
                addEventListener('keyup', (e) => {
                    window.parent.postMessage(
                        { type: 'keyup', key: e.key },
                        '*',
                    );
                });

                // Hijack the original Shut down button in the OS
                window.addEventListener('mousedown', (e) => {
                    if (window.__allowNativeShutdown) return;
                    
                    const path = e.composedPath();
                    for (let i = 0; i < path.length; i++) {
                        const el = path[i];
                        if (el && el.textContent && el.textContent.toLowerCase().includes('shut down')) {
                            // Instead of clientHeight (which breaks if fonts make it taller), check string length
                            // The entire start menu will have a huge textContent length. The button itself is short.
                            if (el.textContent.length < 30) {
                                e.preventDefault();
                                e.stopPropagation();
                                window.parent.postMessage({ type: 'TRIGGER_SHUTDOWN_DIALOG' }, '*');
                                document.body.click(); // Close the menu
                                return;
                            }
                        }
                    }
                }, true); // Use capture phase to intercept before React

                window.addEventListener('message', (e) => {
                    if (e.data && e.data.type === 'EXECUTE_NATIVE_SHUTDOWN') {
                        window.__allowNativeShutdown = true;
                        
                        // 1. Click Start button to open menu
                        const elements = Array.from(document.querySelectorAll('*'));
                        const startBtn = elements.find(el => el.textContent && el.textContent.trim().toLowerCase() === 'start' && el.tagName === 'DIV');
                        if (startBtn) startBtn.click();
                        
                        // 2. Wait a tick for menu to render, then click Shut down
                        setTimeout(() => {
                            const items = Array.from(document.querySelectorAll('*'));
                            const shutdownBtn = items.find(el => el.textContent && el.textContent.toLowerCase().includes('shut down') && el.clientHeight < 50 && el.tagName !== 'BODY');
                            if (shutdownBtn) shutdownBtn.click();
                        }, 50);
                    } else if (e.data && e.data.type === 'SET_MUTE_ICON') {
                        const xSpan = document.getElementById('os-mute-x');
                        if (xSpan) xSpan.style.display = e.data.muted ? 'block' : 'none';
                    }
                });

                // Inject speaker icon hijack overlay
                const overlay = document.createElement('div');
                overlay.id = 'os-mute-overlay';
                overlay.style.cssText = 'position: fixed; bottom: 0; right: 55px; width: 24px; height: 28px; z-index: 999999; cursor: pointer; display: flex; align-items: center; justify-content: center;';
                
                const xSpan = document.createElement('span');
                xSpan.id = 'os-mute-x';
                xSpan.textContent = 'X';
                xSpan.style.cssText = 'color: red; font-family: sans-serif; font-weight: 900; font-size: 16px; display: none; pointer-events: none; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;';
                
                overlay.appendChild(xSpan);
                document.body.appendChild(overlay);

                overlay.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    window.parent.postMessage({ type: 'TOGGLE_OS_MUTE' }, '*');
                });

                // FIX: Icon grid column-wrap — runs once after React renders the desktop shortcuts
                const fixIconLayout = () => {
                    // The shortcuts container sits at position absolute top:16px left:6px
                    const all = document.querySelectorAll('[style]');
                    for (const el of all) {
                        const s = el.style;
                        if (s.position === 'absolute' && s.top === '16px' && s.left === '6px') {
                            s.display = 'flex';
                            s.flexDirection = 'column';
                            s.flexWrap = 'wrap';
                            s.maxHeight = 'calc(100vh - 56px)';
                            s.alignContent = 'flex-start';
                            s.gap = '4px';
                            break;
                        }
                    }
                };

                // Use MutationObserver so we catch the moment React mounts the desktop
                const iconObserver = new MutationObserver(() => {
                    fixIconLayout();
                });
                iconObserver.observe(document.body, { childList: true, subtree: true });
                // Also try immediately and after short delays for safety
                setTimeout(fixIconLayout, 500);
                setTimeout(fixIconLayout, 1500);
                setTimeout(fixIconLayout, 3000);
            };
        </script>

    <style>
        @font-face {
            font-family: 'LeviWindows';
            src: url('/fonts/leviwindows.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Strict Windows 95 Theme Overrides */
        :root {
            --button-highlight: #ffffff;
            --button-face: #dfdfdf;
            --button-shadow: #808080;
            --window-frame: #000000;
            --surface: #c0c0c0; /* Gray for windows and taskbar */
            --surface-hover: #c0c0c0;
        }

        /* Desktop Background */
        body, html, #root, .App {
            background-color: #008080 !important;
            font-family: 'LeviWindows', 'Pixelated MS Sans Serif', 'MS Sans Serif', Tahoma, sans-serif !important;
            -webkit-font-smoothing: none !important;
        }

        /* Ensure texts use the correct font and color */
        * {
            font-family: 'LeviWindows', 'Pixelated MS Sans Serif', 'MS Sans Serif', Tahoma, sans-serif !important;
            -webkit-font-smoothing: none !important;
        }
        
        .toolbar-text, .site-button, p, h1, h2, h3, h4 {
            font-family: 'LeviWindows', 'Pixelated MS Sans Serif', 'MS Sans Serif', Tahoma, sans-serif !important;
            -webkit-font-smoothing: none !important;
        }

        /* Fix Start button / Taskbar */
        .start-menu-option {
            background-color: #c0c0c0 !important;
            color: black !important;
        }
        .start-menu-option:hover {
            background-color: #000080 !important;
            color: white !important;
        }
        
        /* If surface is used for windows, force them to be gray */
        .window, .window-container, [style*="background-color: silver"] {
            background-color: #c0c0c0 !important;
        }

        /* FIX: Remove white/gray box behind desktop shortcut icons */
        img[style*="image-rendering"] {
            background: transparent !important;
            background-color: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }

        /* FIX: Make white backgrounds in icon PNGs disappear on the teal desktop.
           mix-blend-mode:multiply treats white as transparent. */
        .desktop-shortcut-icon + img[style*="image-rendering"],
        .desktop-shortcut-icon ~ img[style*="image-rendering"],
        [style*="cursor: pointer"][style*="padding-bottom"] {
            mix-blend-mode: multiply !important;
        }
        /* Also target the icon container div that wraps the img */
        [style*="cursor: pointer"][style*="padding-bottom"] img {
            mix-blend-mode: multiply !important;
            background: transparent !important;
        }

        /* FIX: Ensure shortcut label wrappers don't add a background */
        [style*="position: absolute"][style*="top: 16px"],
        [style*="position: absolute"][style*="top: 16"] {
            flex-wrap: wrap !important;
            align-content: flex-start !important;
        }
    </style>
